[package]
name = "aura-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aura Community CLI — Open-source Dota 2 configuration optimizer"
repository = "https://github.com/farconi/aura-cli"
authors = ["Farconi"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.13"
